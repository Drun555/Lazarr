[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lazarr"
version = "0.1.0"
description = "Lightweight media acquisition with explainable per-episode matching"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2",
  "pydantic>=2.10,<3", "httpx>=0.27,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.18,<1",
  "cryptography>=44", "argon2-cffi>=23", "beautifulsoup4>=4.12,<5", "packaging>=24",
  "websockets>=15,<18",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
[project.scripts]
lazarr = "lazarr.cli:main"
[tool.setuptools.package-data]
lazarr = ["templates/*.html", "static/*", "bundled/*", "migrations/*", "migrations/versions/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["swarm: real libtorrent loopback integration"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
