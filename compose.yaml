services:
  lazarr:
    image: drun555/lazarr:latest
    build: .
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      LAZARR_DATA_DIR: /data
      LAZARR_PLUGIN_DIR: /plugins
      LAZARR_SECURE_COOKIE: ${LAZARR_SECURE_COOKIE:-0}
      LAZARR_TRAWL_URL: ${LAZARR_TRAWL_URL:-http://trawl:8191}
    ports:
      - "8000:8000"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - lazarr-data:/data
      - lazarr-plugins:/plugins
      - ${LAZARR_DOWNLOADS:-./downloads}:/downloads
    stop_grace_period: 30s
  trawl:
    image: ghcr.io/germondai/trawl:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    environment:
      SESSION_CACHE_DRIVER: memory
      TZ: ${TZ:-UTC}
volumes:
  lazarr-data:
  lazarr-plugins:
